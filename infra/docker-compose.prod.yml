# Producción con la imagen única que publica GitHub Actions en GHCR (Postgres, API, web y Caddy).
# En Coolify: asigna el dominio al servicio "app", puerto 8080; Coolify termina el HTTPS.
# Sin Coolify: agrega `ports: ["8080:8080"]` y pon delante un proxy con HTTPS.
name: habitos

services:
  app:
    image: ghcr.io/paulopabdev/doldia:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?define PUBLIC_URL}
      # Opcionales: si quedan vacíos, se generan en el primer arranque y se guardan en /data/secrets.env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      # Base de datos, secretos generados y respaldos. Respalda este volumen.
      - habitos_data:/data
    expose: ["8080"]

volumes:
  habitos_data:
