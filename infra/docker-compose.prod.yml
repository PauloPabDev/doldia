name: habitos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habitos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: habitos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitos"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://habitos:${POSTGRES_PASSWORD}@db:5432/habitos
      NODE_ENV: production
      API_PORT: "3101"
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3101
    depends_on: [api]

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:443"
      - "443:443/udp"
    environment:
      # Con un dominio real, Caddy obtiene el certificado HTTPS solo.
      DOMAIN: ${DOMAIN:?define DOMAIN}
      API_UPSTREAM: api:3101
      WEB_UPSTREAM: web:3100
      CSP_SCRIPT_EXTRA: ""
      CSP_CONNECT_EXTRA: ""
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
