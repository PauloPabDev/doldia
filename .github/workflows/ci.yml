name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Sin permisos por defecto: cada job pide solo lo que necesita.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habitos
          POSTGRES_PASSWORD: habitos
          POSTGRES_DB: habitos
        ports: ["5442:5432"]
        options: --health-cmd "pg_isready -U habitos" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://habitos:habitos@127.0.0.1:5442/habitos
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      VAPID_SUBJECT: mailto:ci@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: pnpm install --frozen-lockfile
      - name: Claves VAPID temporales
        working-directory: apps/api
        run: node -e "const k=require('web-push').generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey+'\nVAPID_PRIVATE_KEY='+k.privateKey)" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Construye la imagen única y la prueba arrancada en cada PR; en main además la publica en GHCR.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nombre de la imagen
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir para pruebas
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: habitos:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Prueba de humo del contenedor
        run: |
          set -euo pipefail
          check() {
            for _ in $(seq 60); do
              curl -fsS http://127.0.0.1:8080/api/v1/health 2>/dev/null | grep -q '"status":"ok"' && return 0
              [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
              sleep 2
            done
            echo "::error::El contenedor no quedó sano"; return 1
          }
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e PUBLIC_URL=http://localhost:8080 habitos:ci
          check
          code=$(curl -s -o /dev/null -L -w '%{http_code}' http://127.0.0.1:8080/)
          [ "$code" = 200 ] || { echo "::error::La web respondió $code"; exit 1; }
          # Un reinicio debe conservar datos y secretos.
          docker restart smoke
          check
      - name: Logs del contenedor
        if: always()
        run: docker logs smoke 2>&1 | tail -200 || true
      - name: Login en GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        name: Publicar
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          provenance: mode=max
          sbom: true
      - name: Firmar procedencia
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Los secretos viven en el environment "production" (se puede exigir aprobación manual).
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Disparar redeploy en Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Faltan los secretos COOLIFY_WEBHOOK y/o COOLIFY_TOKEN en el environment production"
            exit 1
          fi
          case "$COOLIFY_WEBHOOK" in
            https://*) ;;
            *) echo "::error::COOLIFY_WEBHOOK debe usar https"; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
